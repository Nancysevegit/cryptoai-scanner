name: CryptoAI Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run scanner
        run: node scanner.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit signals
        run: |
          git config user.name "CryptoAI Bot"
          git config user.email "bot@cryptoai.app"
          git add signals.json
          git diff --staged --quiet || git commit -m "📊 Señales actualizadas $(date '+%H:%M')"
          git push
